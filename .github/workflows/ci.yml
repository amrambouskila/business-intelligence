name: CI

on:
  push:
    branches: [main, dev, staging]
  pull_request:
    branches: [main, dev, staging]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  sast:
    name: SAST
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
        with:
          category: codeql
      - name: Semgrep
        run: |
          pipx run semgrep scan --config auto --config p/owasp-top-ten --config p/typescript --config p/react --config p/docker --severity ERROR --error --sarif --output semgrep.sarif || echo "SEMGREP_FAILED=1" >> "$GITHUB_ENV"
      - uses: github/codeql-action/upload-sarif@v3
        if: ${{ !cancelled() }}
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Fail on Semgrep findings
        run: test -z "${SEMGREP_FAILED:-}"
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dependency audit
        run: npm audit --audit-level=high

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Test + Coverage
    runs-on: ubuntu-latest
    needs: sast
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:coverage -- --reporter=default --reporter=junit --outputFile.junit=junit.xml
      - name: Publish test report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: unit tests
          path: junit.xml
          reporter: java-junit
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
      - name: Upload junit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit
          path: junit.xml

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    name: Visual Regression (Playwright)
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    permissions:
      contents: read
      checks: write
      pull-requests: write
    # Pinned Playwright image (browsers preinstalled) — must match @playwright/test
    # so screenshot baselines committed under tests/e2e/__screenshots__ render identically.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - run: npm run build
      - name: E2E (Playwright)
        run: npm run test:e2e -- --reporter=line,html,junit
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: junit-e2e.xml
      # test-reporter shells out to `git ls-files`; inside this container the host-mounted
      # workspace is owned by a different uid than the in-container git user, so git aborts
      # with "dubious ownership" (exit 128). Mark the workspace trusted before it runs.
      # Must share the reporter's `if:` so it also runs when the E2E step fails.
      - name: Mark workspace as safe for git
        if: ${{ !cancelled() }}
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Publish test report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: e2e tests
          path: junit-e2e.xml
          reporter: java-junit
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: business-intelligence:${{ github.sha }}
      - name: Trivy image scan (HIGH/CRITICAL fail the job)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: business-intelligence:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
